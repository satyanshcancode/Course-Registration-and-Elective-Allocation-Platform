<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Allocademy — Direction 3: Quad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --clay: #e8e1d6;
        --paper: #fdfbf7;
        --ink: #241f1a;
        --ink-2: #5b5248;
        --ink-3: #776e64;
        --rule: #d6cdbe;
        --forest: #2f5d4a;
        --forest-2: #244a3b;
        --forest-soft: #dfe9e3;
        --terracotta: #a04a26;
        --terracotta-soft: #f6e3da;
        --amber: #8a5a06;
        --amber-soft: #f7ecd6;
        --display: 'Fraunces', Georgia, serif;
        --sans: 'Work Sans', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--clay);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header {
        padding: 24px 32px;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-family: var(--display);
        font-optical-sizing: auto;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--forest);
      }
      /* The mark is the seat dot-matrix: three taken, one free. */
      .mark {
        display: grid;
        grid-template-columns: repeat(2, 7px);
        gap: 3px;
      }
      .mark i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--forest);
      }
      .mark i:last-child {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--terracotta);
      }

      main {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .sheet {
        width: 100%;
        max-width: 420px;
        background: var(--paper);
        border-radius: 10px;
        border: 1px solid var(--rule);
        padding: 42px 44px 36px;
        position: relative;
      }
      /* A single quiet accent: a forest spine down the left edge */
      .sheet::before {
        content: '';
        position: absolute;
        left: 0;
        top: 24px;
        bottom: 24px;
        width: 4px;
        border-radius: 0 4px 4px 0;
        background: var(--forest);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--terracotta);
        margin-bottom: 12px;
      }
      h1 {
        font-family: var(--display);
        font-optical-sizing: auto;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.02;
        margin-bottom: 12px;
      }
      .lede {
        color: var(--ink-2);
        font-size: 14.5px;
        margin-bottom: 30px;
      }

      .field {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 7px;
      }
      input {
        width: 100%;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: #fff;
        border: 1.5px solid var(--rule);
        border-radius: 7px;
        padding: 11px 13px;
      }
      input:focus {
        outline: 0;
        border-color: var(--forest);
        box-shadow: 0 0 0 3px var(--forest-soft);
      }
      .pwrow {
        display: flex;
        gap: 9px;
      }
      .pwrow input {
        flex: 1;
      }
      .ghost {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--forest);
        background: transparent;
        border: 1.5px solid var(--rule);
        border-radius: 7px;
        padding: 0 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .ghost:hover {
        border-color: var(--forest);
        background: var(--forest-soft);
      }

      button.primary {
        width: 100%;
        margin-top: 8px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #fdfbf7;
        background: var(--forest);
        border: 0;
        border-radius: 7px;
        padding: 14px;
        cursor: pointer;
      }
      button.primary:hover {
        background: var(--forest-2);
      }

      .foot {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--rule);
        font-size: 13.5px;
        color: var(--ink-2);
      }
      .foot a {
        color: var(--forest);
        font-weight: 600;
        text-underline-offset: 3px;
      }

      footer {
        padding: 22px 32px;
        font-size: 12.5px;
        color: var(--ink-3);
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="wordmark">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Allocademy
      </span>
    </header>

    <main>
      <section class="sheet" aria-labelledby="t">
        <p class="eyebrow">Students &amp; registrar staff</p>
        <h1 id="t">Sign in</h1>
        <p class="lede">
          Use your university e-mail and password. Accounts are created by the registrar — open the
          link in your invitation to set a password.
        </p>

        <form>
          <div class="field">
            <label for="e">E-mail address</label>
            <input id="e" type="email" value="aarav.sharma@university.edu" />
          </div>
          <div class="field">
            <label for="p">Password</label>
            <div class="pwrow">
              <input id="p" type="password" value="xxxxxxxxxxxx" />
              <button class="ghost" type="button">Show</button>
            </div>
          </div>
          <button class="primary" type="button">Sign in</button>
        </form>

        <p class="foot">Forgotten your password? <a href="#">Send me a reset link</a></p>
      </section>
    </main>

    <footer>
      <span>Allocademy · University Registrar</span>
      <span>Direction 3 — Quad</span>
    </footer>
  </body>
</html>
